name: Bug report
description: Something isn't working right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SimpleCMS version
      description: Shown on the extension's card at chrome://extensions
      placeholder: "1.0.0"
  - type: input
    id: chrome
    attributes:
      label: Chrome version and OS
      placeholder: "Chrome 129 on Windows 11"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Please don't attach project files with personal info in them.
